name: VitaCheat NG ARM Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vcng-arm-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact VitaCheat NG 0.14.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat payload-arm/part_00 payload-arm/part_01 payload-arm/part_02 payload-arm/part_03 payload-arm/part_04 payload-arm/part_05 payload-arm/part_06 payload-arm/part_07 payload-arm/part_08 payload-arm/part_09 payload-arm/part_10 payload-arm/part_11 > vcng0144-armmin.tar.xz.b64
          base64 --decode vcng0144-armmin.tar.xz.b64 > vcng0144-armmin.tar.xz
          echo '868f176728ad70c2456118aff7d2f2f2ed0097704083eb78eedad7cf34395a89  vcng0144-armmin.tar.xz' | sha256sum -c -
          xz -t vcng0144-armmin.tar.xz
          tar -xJf vcng0144-armmin.tar.xz
          test "$(cat vcng0144-armmin/VERSION)" = '0.14.4'
          cp build-fixes/api.h vcng0144-armmin/vita/kernel/api.h

      - name: Build ARM plugins and installer VPK with VitaSDK 2026.08
        id: arm_build
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace/vcng0144-armmin vitasdk/vitasdk:2026.08 bash -lc '
            set -euo pipefail
            export VITASDK=/usr/local/vitasdk
            export PATH="$VITASDK/bin:$PATH"
            arm-vita-eabi-gcc --version
            cmake -S vita -B build-vita -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
            cmake --build build-vita --target dist -j2
            cp build-vita/dist/VitaCheatNG-Installer.vpk build-vita/dist/VitaCheat-NG-0.14.4.vpk
            sha256sum build-vita/dist/vitacheat_ng.skprx build-vita/dist/vitacheat_ng.suprx build-vita/dist/VitaCheat-NG-0.14.4.vpk > build-vita/dist/SHA256SUMS.txt
          ' 2>&1 | tee vcng-arm-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitaCheat-NG-0.14.4-build-log
          path: vcng-arm-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload VitaCheat NG 0.14.4 ARM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VitaCheat-NG-0.14.4-ARM
          path: |
            vcng0144-armmin/build-vita/dist/vitacheat_ng.skprx
            vcng0144-armmin/build-vita/dist/vitacheat_ng.suprx
            vcng0144-armmin/build-vita/dist/VitaCheat-NG-0.14.4.vpk
            vcng0144-armmin/build-vita/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
