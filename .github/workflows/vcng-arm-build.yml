name: VitaCheat NG ARM Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vcng-arm-build.yml'
      - 'vcng0145-patch/**'
      - 'vcng0146-patch/**'
      - 'vcng0147-patch/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct baseline and apply VitaCheat NG 0.14.5-0.14.7 patches
        shell: bash
        run: |
          set -euo pipefail
          cat payload-arm/part_00 payload-arm/part_01 payload-arm/part_02 payload-arm/part_03 payload-arm/part_04 payload-arm/part_05 payload-arm/part_06 payload-arm/part_07 payload-arm/part_08 payload-arm/part_09 payload-arm/part_10 payload-arm/part_11 > vcng0144-armmin.tar.xz.b64
          base64 --decode vcng0144-armmin.tar.xz.b64 > vcng0144-armmin.tar.xz
          echo '868f176728ad70c2456118aff7d2f2f2ed0097704083eb78eedad7cf34395a89  vcng0144-armmin.tar.xz' | sha256sum -c -
          xz -t vcng0144-armmin.tar.xz
          tar -xJf vcng0144-armmin.tar.xz
          cp build-fixes/api.h vcng0144-armmin/vita/kernel/api.h

          cat vcng0145-patch/part_00 vcng0145-patch/part_01 vcng0145-patch/part_02 vcng0145-patch/part_03 vcng0145-patch/part_04 > vcng0145-arm.patch.xz.b64
          base64 --decode vcng0145-arm.patch.xz.b64 > vcng0145-arm.patch.xz
          echo '6ba1fdf4ced92bae4db6dce5752e68de22f00356f8242e58cc84a2c0719c1d08  vcng0145-arm.patch.xz' | sha256sum -c -
          xz -t vcng0145-arm.patch.xz
          xz -dc vcng0145-arm.patch.xz > vcng0145-arm.patch

          cat vcng0146-patch/part_00 > vcng0146-arm.patch.xz.b64
          base64 --decode vcng0146-arm.patch.xz.b64 > vcng0146-arm.patch.xz
          echo 'f24210fdfa32be733b66a69df4561645260825371a5beb206251743d07486a10  vcng0146-arm.patch.xz' | sha256sum -c -
          xz -t vcng0146-arm.patch.xz
          xz -dc vcng0146-arm.patch.xz > vcng0146-arm.patch

          cat vcng0147-patch/part_00 > vcng0147-arm.patch.xz.b64
          base64 --decode vcng0147-arm.patch.xz.b64 > vcng0147-arm.patch.xz
          echo '779d327885dadc53cdbe1e5370607e4c88f16ba592638b6b2cd81f11b010c92e  vcng0147-arm.patch.xz' | sha256sum -c -
          xz -t vcng0147-arm.patch.xz
          xz -dc vcng0147-arm.patch.xz > vcng0147-arm.patch

          cd vcng0144-armmin
          git init -q
          git apply --check --verbose ../vcng0145-arm.patch
          git apply --verbose ../vcng0145-arm.patch
          git apply --check --verbose ../vcng0145-patch/linkfix.patch
          git apply --verbose ../vcng0145-patch/linkfix.patch
          test "$(cat VERSION)" = '0.14.5'
          git apply --check --verbose ../vcng0146-arm.patch
          git apply --verbose ../vcng0146-arm.patch
          test "$(cat VERSION)" = '0.14.6'
          git apply --check --verbose ../vcng0147-arm.patch
          git apply --verbose ../vcng0147-arm.patch
          test "$(cat VERSION)" = '0.14.7'

      - name: Build ARM plugins and installer VPK with VitaSDK 2026.08
        id: arm_build
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace/vcng0144-armmin vitasdk/vitasdk:2026.08 bash -lc '
            set -euo pipefail
            export VITASDK=/usr/local/vitasdk
            export PATH="$VITASDK/bin:$PATH"
            arm-vita-eabi-gcc --version
            cmake -S vita -B build-vita -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
            cmake --build build-vita --target dist -j2
            cp build-vita/dist/VitaCheatNG-Installer.vpk build-vita/dist/VitaCheat-NG-0.14.7.vpk
            sha256sum build-vita/dist/vitacheat_ng.skprx build-vita/dist/vitacheat_ng.suprx build-vita/dist/VitaCheat-NG-0.14.7.vpk > build-vita/dist/SHA256SUMS.txt
          ' 2>&1 | tee vcng-arm-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitaCheat-NG-0.14.7-build-log
          path: vcng-arm-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload VitaCheat NG 0.14.7 ARM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VitaCheat-NG-0.14.7-ARM
          path: |
            vcng0144-armmin/build-vita/dist/vitacheat_ng.skprx
            vcng0144-armmin/build-vita/dist/vitacheat_ng.suprx
            vcng0144-armmin/build-vita/dist/VitaCheat-NG-0.14.7.vpk
            vcng0144-armmin/build-vita/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
